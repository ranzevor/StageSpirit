name: Python checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.8.2"
          enable-cache: true
      - name: Install locked environment
        run: uv sync --frozen
      - name: Lint
        run: uv run --frozen ruff check src scripts tests examples
      - name: Format
        run: uv run --frozen ruff format --check src scripts tests examples
      - name: Types
        run: uv run --frozen pyright
      - name: Runtime contract
        run: uv run --frozen python scripts/export_contracts.py --check
      - name: Runtime and installed wheel
        run: uv run --frozen pytest tests/unit tests/integration tests/contract tests/e2e

  documentation:
    name: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.15.0"
      - name: Test documentation checker
        run: node --test tests/governance/check_docs.test.cjs
      - name: Check documentation and JSON examples
        run: node scripts/check_docs.cjs
