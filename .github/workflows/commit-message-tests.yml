name: Commit message tests

on:
  pull_request:
    paths:
      - ".github/scripts/**"
      - ".github/workflows/commit-message-tests.yml"
      - ".github/workflows/governance-metadata.yml"
      - "scripts/install_commit_hook.cjs"
      - "tests/governance/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: commit-message-tests
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.15.0"
      - name: Check messages, pagination and installed hooks
        run: node --test tests/governance/*.test.cjs
